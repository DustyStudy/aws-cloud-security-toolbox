AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 1 of 2 for the Claude apps gateway reference deployment: creates
  only the ECR repository. Deploy this stack first, build and push your
  gateway image into it (see this tool's README), then deploy
  ../infrastructure/template.yaml, which takes this repository's URI as
  a parameter. Split into its own stack because a single CloudFormation
  stack can't atomically create an empty ECR repository, wait for a
  human to build and push an image, and then create an ECS service that
  needs that image to exist - the service would never stabilize and the
  whole stack would roll back.

Parameters:
  RepositoryName:
    Type: String
    Description: Name for the ECR repository (also used as the stack/resource name prefix for the infrastructure stack - keep them matching for clarity).

Resources:
  EcrKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${RepositoryName} ECR repository."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
            # The ECS execution role in ../infrastructure/template.yaml
            # is granted kms:Decrypt on this key's ARN via its own IAM
            # policy - no separate service-principal statement is
            # needed here for that, since it's an IAM-side grant, not a
            # cross-account one.

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt EcrKey.Arn

Outputs:
  EcrRepositoryUri:
    Description: >
      Push your built gateway image here, then pass this value as the
      EcrRepositoryUri parameter to ../infrastructure/template.yaml.
    Value: !GetAtt EcrRepository.RepositoryUri

  EcrRepositoryName:
    Description: Name of the ECR repository (for docker/aws ecr CLI commands)
    Value: !Ref EcrRepository

  EcrKeyArn:
    Description: >
      ARN of the KMS key encrypting this repository - grant your ECS
      execution role kms:Decrypt on this ARN (already done automatically
      in ../infrastructure/template.yaml if you deploy that stack as-is).
    Value: !GetAtt EcrKey.Arn
