AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys a library of preventive Service Control Policies (guardrails) and
  attaches them to the given AWS Organizations targets (OU IDs, account
  IDs, or the org root). Each policy can be toggled independently. Deploy
  this stack in the Organizations **management account** (or a delegated
  admin account for Organizations, if configured).

Parameters:
  TargetIds:
    Type: CommaDelimitedList
    Description: >
      OU IDs, account IDs, and/or the org root ID to attach every enabled
      policy to (e.g. "ou-abcd-11111111,123456789012").

  EnableDenyRootUser:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny all actions taken as the root user.

  EnableDenyDisableSecurityServices:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny disabling CloudTrail, Config, GuardDuty, or Security Hub.

  EnableRequireIMDSv2:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny launching or modifying EC2 instances without IMDSv2 required.

  EnableDenyLeaveOrganization:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny member accounts from leaving the Organization.

  EnableDenyDisableS3PublicAccessBlock:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny disabling S3 Block Public Access at the account or bucket level.

  EnableRestrictRegions:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Deny actions outside the regions listed in AllowedRegions (global
      services like IAM, CloudFront, Route 53, and Organizations are
      exempted). Off by default - review AllowedRegions before enabling.

  AllowedRegions:
    Type: CommaDelimitedList
    Default: "us-east-1"
    Description: >
      Regions permitted when EnableRestrictRegions is true (e.g.
      "us-gov-west-1,us-gov-east-1" for GovCloud). Ignored otherwise.

Conditions:
  CreateDenyRootUser: !Equals [!Ref EnableDenyRootUser, "true"]
  CreateDenyDisableSecurityServices: !Equals [!Ref EnableDenyDisableSecurityServices, "true"]
  CreateRequireIMDSv2: !Equals [!Ref EnableRequireIMDSv2, "true"]
  CreateDenyLeaveOrganization: !Equals [!Ref EnableDenyLeaveOrganization, "true"]
  CreateDenyDisableS3PublicAccessBlock: !Equals [!Ref EnableDenyDisableS3PublicAccessBlock, "true"]
  CreateRestrictRegions: !Equals [!Ref EnableRestrictRegions, "true"]

Resources:
  DenyRootUserPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateDenyRootUser
    Properties:
      Name: !Sub "${AWS::StackName}-deny-root-user"
      Description: Denies all actions taken as the account root user.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyRootUser",
              "Effect": "Deny",
              "Action": "*",
              "Resource": "*",
              "Condition": {
                "StringLike": { "aws:PrincipalArn": "arn:*:iam::*:root" }
              }
            }
          ]
        }

  DenyDisableSecurityServicesPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateDenyDisableSecurityServices
    Properties:
      Name: !Sub "${AWS::StackName}-deny-disable-security-services"
      Description: Denies disabling CloudTrail, Config, GuardDuty, or Security Hub.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyDisableCloudTrail",
              "Effect": "Deny",
              "Action": [
                "cloudtrail:StopLogging",
                "cloudtrail:DeleteTrail",
                "cloudtrail:UpdateTrail",
                "cloudtrail:PutEventSelectors"
              ],
              "Resource": "*"
            },
            {
              "Sid": "DenyDisableConfig",
              "Effect": "Deny",
              "Action": [
                "config:DeleteConfigurationRecorder",
                "config:DeleteDeliveryChannel",
                "config:StopConfigurationRecorder",
                "config:DeleteConfigRule",
                "config:DeleteRemediationConfiguration"
              ],
              "Resource": "*"
            },
            {
              "Sid": "DenyDisableGuardDuty",
              "Effect": "Deny",
              "Action": [
                "guardduty:DeleteDetector",
                "guardduty:DisassociateFromMasterAccount",
                "guardduty:DisassociateMembers",
                "guardduty:DisableOrganizationAdminAccount"
              ],
              "Resource": "*"
            },
            {
              "Sid": "DenyDisableSecurityHub",
              "Effect": "Deny",
              "Action": [
                "securityhub:DisableSecurityHub",
                "securityhub:DisableImportFindingsForProduct",
                "securityhub:DeleteInsight"
              ],
              "Resource": "*"
            }
          ]
        }

  RequireIMDSv2Policy:
    Type: AWS::Organizations::Policy
    Condition: CreateRequireIMDSv2
    Properties:
      Name: !Sub "${AWS::StackName}-require-imdsv2"
      Description: Denies launching or modifying EC2 instances without IMDSv2 required.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyLaunchInstanceWithoutIMDSv2",
              "Effect": "Deny",
              "Action": "ec2:RunInstances",
              "Resource": "arn:*:ec2:*:*:instance/*",
              "Condition": {
                "StringNotEquals": { "ec2:MetadataHttpTokens": "required" }
              }
            },
            {
              "Sid": "DenyDowngradeToIMDSv1",
              "Effect": "Deny",
              "Action": "ec2:ModifyInstanceMetadataOptions",
              "Resource": "*",
              "Condition": {
                "StringNotEquals": { "ec2:MetadataHttpTokens": "required" }
              }
            }
          ]
        }

  DenyLeaveOrganizationPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateDenyLeaveOrganization
    Properties:
      Name: !Sub "${AWS::StackName}-deny-leave-organization"
      Description: Denies member accounts from leaving the Organization.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyLeaveOrganization",
              "Effect": "Deny",
              "Action": "organizations:LeaveOrganization",
              "Resource": "*"
            }
          ]
        }

  DenyDisableS3PublicAccessBlockPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateDenyDisableS3PublicAccessBlock
    Properties:
      Name: !Sub "${AWS::StackName}-deny-disable-s3-pab"
      Description: Denies disabling S3 Block Public Access at the account or bucket level.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyDisableAccountBlockPublicAcls",
              "Effect": "Deny",
              "Action": "s3:PutAccountPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutAccountPublicAccessBlock:BlockPublicAcls": "false" } }
            },
            {
              "Sid": "DenyDisableAccountBlockPublicPolicy",
              "Effect": "Deny",
              "Action": "s3:PutAccountPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutAccountPublicAccessBlock:BlockPublicPolicy": "false" } }
            },
            {
              "Sid": "DenyDisableAccountIgnorePublicAcls",
              "Effect": "Deny",
              "Action": "s3:PutAccountPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutAccountPublicAccessBlock:IgnorePublicAcls": "false" } }
            },
            {
              "Sid": "DenyDisableAccountRestrictPublicBuckets",
              "Effect": "Deny",
              "Action": "s3:PutAccountPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutAccountPublicAccessBlock:RestrictPublicBuckets": "false" } }
            },
            {
              "Sid": "DenyDisableBucketBlockPublicAcls",
              "Effect": "Deny",
              "Action": "s3:PutBucketPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutBucketPublicAccessBlock:BlockPublicAcls": "false" } }
            },
            {
              "Sid": "DenyDisableBucketBlockPublicPolicy",
              "Effect": "Deny",
              "Action": "s3:PutBucketPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutBucketPublicAccessBlock:BlockPublicPolicy": "false" } }
            },
            {
              "Sid": "DenyDisableBucketIgnorePublicAcls",
              "Effect": "Deny",
              "Action": "s3:PutBucketPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutBucketPublicAccessBlock:IgnorePublicAcls": "false" } }
            },
            {
              "Sid": "DenyDisableBucketRestrictPublicBuckets",
              "Effect": "Deny",
              "Action": "s3:PutBucketPublicAccessBlock",
              "Resource": "*",
              "Condition": { "Bool": { "s3:PutBucketPublicAccessBlock:RestrictPublicBuckets": "false" } }
            }
          ]
        }

  RestrictRegionsPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateRestrictRegions
    Properties:
      Name: !Sub "${AWS::StackName}-restrict-regions"
      Description: Denies actions outside the allow-listed regions (global services exempted).
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content:
        !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyAllOutsideAllowedRegions",
                  "Effect": "Deny",
                  "NotAction": [
                    "a4b:*", "acm:*", "aws-marketplace-management:*", "aws-marketplace:*",
                    "aws-portal:*", "budgets:*", "ce:*", "chime:*", "cloudfront:*", "config:*",
                    "cur:*", "directconnect:*", "ec2:DescribeRegions", "ec2:DescribeAvailabilityZones",
                    "fms:*", "globalaccelerator:*", "health:*", "iam:*", "importexport:*", "kms:*",
                    "mobileanalytics:*", "networkmanager:*", "organizations:*", "pricing:*",
                    "route53:*", "route53domains:*", "route53-recovery-cluster:*",
                    "s3:GetAccountPublicAccessBlock", "shield:*", "sts:*", "support:*",
                    "trustedadvisor:*", "waf-regional:*", "waf:*", "wafv2:*", "wellarchitected:*"
                  ],
                  "Resource": "*",
                  "Condition": {
                    "StringNotEquals": { "aws:RequestedRegion": ["${RegionsJoined}"] }
                  }
                }
              ]
            }
          - RegionsJoined: !Join ['","', !Ref AllowedRegions]

Outputs:
  AttachedTargets:
    Description: Targets these guardrail policies were attached to
    Value: !Join [",", !Ref TargetIds]
