AWSTemplateFormatVersion: "2010-09-09"
Description: >
  An on-demand SSM Automation runbook for isolating a suspected-compromised
  EC2 instance during incident response: tags it, snapshots every attached
  EBS volume for forensics, swaps its security groups for a fully-isolated
  one (no inbound, no outbound), optionally stops it, and notifies via
  SNS. Invoked manually (console, CLI, or paged into a ChatOps flow) - this
  is deliberately not automatic, since isolating the wrong instance on a
  false positive can itself cause an outage. Works in AWS commercial and
  GovCloud.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC to create the isolation security group in. Deploy one stack per
      VPC you want this runbook available for.

  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for isolation
      notifications. Leave blank to skip the subscription.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  IsolationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fully isolated SG for incident-response quarantine - no inbound, no outbound.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Placeholder rule required to override the default allow-all-outbound rule - effectively blocks all egress.
      Tags:
        - Key: Purpose
          Value: incident-response-isolation

  IsolationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-isolation-notifications"
      KmsMasterKeyId: alias/aws/sns

  IsolationTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref IsolationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  AutomationAssumeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-isolation-automation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2IsolationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: "*"
                # Describe is read-only and EC2 doesn't support resource-level
                # scoping for it - "*" is required here.
              - Effect: Allow
                Action:
                  - ec2:CreateSnapshot
                  - ec2:CreateTags
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:snapshot/*"
              - Effect: Allow
                Action:
                  - ec2:ModifyInstanceAttribute
                  - ec2:StopInstances
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref IsolationTopic

  IsolationRunbook:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${AWS::StackName}-IsolateCompromisedInstance"
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: Isolates a suspected-compromised EC2 instance for incident response.
        assumeRole: "{{ AutomationAssumeRole }}"
        parameters:
          InstanceId:
            type: String
            description: The instance to isolate.
          IncidentId:
            type: String
            description: Optional ticket/incident reference, used to tag the instance and snapshots.
            default: unspecified
          StopInstance:
            type: String
            description: Whether to also stop the instance after isolating its network access.
            default: "false"
            allowedValues: ["true", "false"]
          IsolationSecurityGroupId:
            type: String
            description: The isolation security group to apply.
            default: !GetAtt IsolationSecurityGroup.GroupId
          NotificationTopicArn:
            type: String
            description: SNS topic to notify once isolation is complete.
            default: !Ref IsolationTopic
          AutomationAssumeRole:
            type: String
            description: IAM role ARN used by SSM Automation to execute this document.
            default: !GetAtt AutomationAssumeRole.Arn
        mainSteps:
          - name: TagInstanceForIsolation
            action: aws:createTags
            inputs:
              ResourceType: EC2
              ResourceIds:
                - "{{ InstanceId }}"
              Tags:
                - Key: IsolatedForIR
                  Value: "true"
                - Key: IsolationTimestamp
                  Value: "{{ global:DATE_TIME }}"
                - Key: IsolationIncidentId
                  Value: "{{ IncidentId }}"

          - name: SnapshotAttachedVolumes
            action: aws:executeScript
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                InstanceId: "{{ InstanceId }}"
                IncidentId: "{{ IncidentId }}"
              Script: |-
                import boto3

                def handler(events, context):
                    ec2 = boto3.client("ec2")
                    instance_id = events["InstanceId"]
                    incident_id = events.get("IncidentId") or "unspecified"
                    resp = ec2.describe_instances(InstanceIds=[instance_id])
                    snapshot_ids = []
                    for reservation in resp["Reservations"]:
                        for instance in reservation["Instances"]:
                            for bdm in instance.get("BlockDeviceMappings", []):
                                ebs = bdm.get("Ebs")
                                if not ebs:
                                    continue
                                volume_id = ebs["VolumeId"]
                                snap = ec2.create_snapshot(
                                    VolumeId=volume_id,
                                    Description=(
                                        f"IR isolation snapshot of {volume_id} "
                                        f"from instance {instance_id} (incident {incident_id})"
                                    ),
                                    TagSpecifications=[{
                                        "ResourceType": "snapshot",
                                        "Tags": [
                                            {"Key": "IsolationIncidentId", "Value": incident_id},
                                            {"Key": "SourceInstanceId", "Value": instance_id},
                                        ],
                                    }],
                                )
                                snapshot_ids.append(snap["SnapshotId"])
                    return {"SnapshotIds": snapshot_ids}
            outputs:
              - Name: SnapshotIds
                Selector: $.Payload.SnapshotIds
                Type: StringList

          - name: ApplyIsolationSecurityGroup
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: ModifyInstanceAttribute
              InstanceId: "{{ InstanceId }}"
              Groups:
                - "{{ IsolationSecurityGroupId }}"

          - name: CheckIfShouldStop
            action: aws:branch
            inputs:
              Choices:
                - NextStep: StopInstanceStep
                  Variable: "{{ StopInstance }}"
                  StringEquals: "true"
              Default: NotifyStep

          - name: StopInstanceStep
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: StopInstances
              InstanceIds:
                - "{{ InstanceId }}"

          - name: NotifyStep
            action: aws:executeAwsApi
            isEnd: true
            inputs:
              Service: sns
              Api: Publish
              TopicArn: "{{ NotificationTopicArn }}"
              Subject: "EC2 instance {{ InstanceId }} isolated for incident response"
              Message: >-
                Instance {{ InstanceId }} was tagged, had its attached volumes
                snapshotted (see the SnapshotAttachedVolumes step output for
                snapshot IDs), and had its security groups replaced with the
                isolation group {{ IsolationSecurityGroupId }}. StopInstance
                was set to {{ StopInstance }}. Incident reference: {{ IncidentId }}.

Outputs:
  RunbookName:
    Description: Name of the SSM Automation document - run it via the console (Systems Manager > Automation) or `aws ssm start-automation-execution`
    Value: !Ref IsolationRunbook

  IsolationSecurityGroupId:
    Description: ID of the isolation security group
    Value: !GetAtt IsolationSecurityGroup.GroupId

  SNSTopicArn:
    Description: ARN of the SNS topic used for isolation notifications
    Value: !Ref IsolationTopic
