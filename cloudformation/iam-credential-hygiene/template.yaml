AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Scans every IAM user's access keys on a schedule and deactivates (never
  deletes) any key that's too old or unused for too long, notifying via
  SNS. A common CIS Benchmark / Wiz finding this closes automatically
  instead of relying on someone to review a credential report. Works in
  AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for deactivation
      notifications. Leave blank to skip the subscription.

  MaxKeyAgeDays:
    Type: Number
    Default: 180
    Description: Deactivate any active key older than this many days, regardless of use.

  MaxUnusedDays:
    Type: Number
    Default: 90
    Description: >
      Deactivate any active key not used in this many days (or never used
      and older than this many days).

  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"
    Description: EventBridge schedule expression controlling how often the scan runs.

  ExemptTagKey:
    Type: String
    Default: ""
    Description: >
      Optional IAM user tag key. Users carrying this tag are skipped
      entirely - use for break-glass/service accounts that intentionally
      hold long-lived keys. Leave blank to check every user.

  ExemptTagValue:
    Type: String
    Default: ""
    Description: >
      Optional value ExemptTagKey must match. Leave blank to exempt on
      the tag key's presence alone (any value).

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (deactivate_stale_iam_keys.py zipped as lambda.zip). Must be in the
      same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "iam-credential-hygiene/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  HygieneTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-iam-key-deactivations"
      KmsMasterKeyId: alias/aws/sns

  HygieneTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref HygieneTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  HygieneDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-hygiene-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600 # 14 days

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} IAM hygiene Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-deactivate-stale-iam-keys"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-iam-hygiene-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IAMHygienePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:ListUsers
                Resource: "*"
                # ListUsers has no resource-level support in IAM - must be "*".
              - Effect: Allow
                Action:
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - iam:ListUserTags
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*"
              - Effect: Allow
                Action:
                  - iam:UpdateAccessKey
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref HygieneTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt HygieneDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  HygieneFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls IAM/SNS/SQS control-plane APIs over
              public AWS endpoints - it doesn't touch any resource inside a
              customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-deactivate-stale-iam-keys"
      Description: Deactivates stale/unused IAM access keys on a schedule.
      Runtime: python3.12
      Handler: deactivate_stale_iam_keys.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt HygieneDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref HygieneTopic
          MAX_KEY_AGE_DAYS: !Ref MaxKeyAgeDays
          MAX_UNUSED_DAYS: !Ref MaxUnusedDays
          EXEMPT_TAG_KEY: !Ref ExemptTagKey
          EXEMPT_TAG_VALUE: !Ref ExemptTagValue
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  HygieneFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${HygieneFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  HygieneScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Triggers the IAM credential hygiene scan on a schedule.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt HygieneFunction.Arn
          Id: HygieneFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HygieneFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HygieneScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the IAM hygiene Lambda function
    Value: !GetAtt HygieneFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for deactivation notifications
    Value: !Ref HygieneTopic
