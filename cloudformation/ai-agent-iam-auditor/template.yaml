AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Scans every IAM role's trust policy for AI/agent service principals
  (Bedrock, SageMaker, Amazon Q) on a schedule, and for any matching
  role, flags overly-broad attached/inline permissions (full admin, a
  service-wide wildcard on a sensitive service, or AdministratorAccess),
  notifying via SNS. Detective only - never modifies anything, since
  automatically stripping an agent's permissions could break its
  function. Works in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for audit
      notifications. Leave blank to skip the subscription.

  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"
    Description: EventBridge schedule expression controlling how often the audit runs.

  AIServicePrincipals:
    Type: CommaDelimitedList
    Default: "bedrock.amazonaws.com,sagemaker.amazonaws.com,q.amazonaws.com,qbusiness.amazonaws.com"
    Description: Trust-policy service principals to treat as "AI/agent" roles.

  SensitiveWildcardServices:
    Type: CommaDelimitedList
    Default: "iam,ec2,s3,kms,organizations,sts"
    Description: >
      IAM service prefixes where "<service>:*" combined with Resource "*"
      is flagged as over-broad.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (audit_ai_agent_iam_roles.py zipped as lambda.zip). Must be in the
      same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "ai-agent-iam-auditor/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  AuditTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-ai-agent-iam-audit"
      KmsMasterKeyId: alias/aws/sns

  AuditTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AuditTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  AuditDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-audit-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} AI agent IAM auditor Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-audit-ai-agent-iam"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ai-agent-auditor-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AIAgentIAMAuditorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:ListRoles
                Resource: "*"
                # ListRoles has no resource-level support in IAM - must be "*".
              - Effect: Allow
                Action:
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*"
              - Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource: !Sub "arn:${AWS::Partition}:iam::aws:policy/*"
                # Covers AWS managed policies, which is what's typically
                # attached to roles this auditor inspects. If your org also
                # attaches customer-managed policies to AI/agent roles,
                # broaden this to include arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*.
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AuditTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt AuditDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  AuditFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls IAM/SNS/SQS control-plane APIs
              over public AWS endpoints - it doesn't touch any resource
              inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-audit-ai-agent-iam"
      Description: Detects over-permissioned IAM roles trusted by AI/agent services.
      Runtime: python3.12
      Handler: audit_ai_agent_iam_roles.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt AuditDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AuditTopic
          AI_SERVICE_PRINCIPALS: !Join [",", !Ref AIServicePrincipals]
          SENSITIVE_WILDCARD_SERVICES: !Join [",", !Ref SensitiveWildcardServices]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  AuditFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AuditFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  AuditScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Triggers the AI agent IAM audit on a schedule.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt AuditFunction.Arn
          Id: AuditFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuditFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AuditScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the auditor Lambda function
    Value: !GetAtt AuditFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for audit notifications
    Value: !Ref AuditTopic
