AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Continuous-compliance path: an AWS Config managed rule flags any security
  group with SSH (22) or RDP (3389) open to the internet, and an SSM
  Automation document auto-remediates by invoking the shared remediation
  Lambda. Catches drift and rules created before this stack existed, not
  just new API calls (see the sibling event-driven/ template for that).
  Requires AWS Config already enabled in the account/region. Works in AWS
  commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for remediation
      notifications. Leave blank to skip the subscription.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (remediate_open_ssh_rdp.py zipped as lambda.zip). Must be in the same
      region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "auto-remediate-open-ssh-rdp/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  MaximumExecutionFrequency:
    Type: String
    Default: TwentyFour_Hours
    AllowedValues:
      - One_Hour
      - Three_Hours
      - Six_Hours
      - Twelve_Hours
      - TwentyFour_Hours
    Description: How often AWS Config re-evaluates all security groups against this rule.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip (most accounts don't have a signing pipeline set up; set
      this if yours does and requires it).

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  RemediationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-sg-remediation-notifications"
      KmsMasterKeyId: alias/aws/sns

  RemediationTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref RemediationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  RemediationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-remediation-dlq"
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600 # 14 days - time to notice and investigate a failed remediation

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} remediation Lambda's log group and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-remediate-open-ssh-rdp"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-remediate-ssh-rdp-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RemediateSSHRDPPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                Resource: "*"
                # Describe is a read-only action and EC2 does not support
                # resource-level permissions for it - "*" is required here.
              - Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RemediationTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RemediationDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
                # X-Ray does not support resource-level permissions for these actions.

  RemediationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls AWS control-plane APIs (EC2, SNS,
              SQS) over the public AWS API endpoints - it doesn't touch any
              resource inside a customer VPC. Placing it in a VPC would add
              NAT gateway/VPC endpoint cost and complexity with no security
              benefit for this workload.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-remediate-open-ssh-rdp"
      Description: Revokes SG ingress rules that open 22/3389 to the internet.
      Runtime: python3.12
      Handler: remediate_open_ssh_rdp.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt RemediationDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref RemediationTopic
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  RemediationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RemediationFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  AutomationAssumeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ssm-automation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeRemediationLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RemediationFunction.Arn

  RemediationAutomationDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${AWS::StackName}-RemediateOpenSSHRDP"
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: Invokes the remediation Lambda for a non-compliant security group.
        assumeRole: "{{ AutomationAssumeRole }}"
        parameters:
          SecurityGroupId:
            type: String
            description: The non-compliant security group ID (Config passes this as RESOURCE_ID).
          AutomationAssumeRole:
            type: String
            description: IAM role ARN used by SSM Automation to execute this document.
        mainSteps:
          - name: InvokeRemediationLambda
            action: aws:invokeLambdaFunction
            inputs:
              FunctionName: !Ref RemediationFunction
              InputPayload:
                security_group_id: "{{ SecurityGroupId }}"

  RestrictedPortsConfigRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: !Sub "${AWS::StackName}-restricted-ssh-rdp"
      Description: Flags security groups that allow unrestricted inbound access to SSH (22) or RDP (3389).
      Source:
        Owner: AWS
        SourceIdentifier: RESTRICTED_INCOMING_TRAFFIC
      InputParameters:
        blockedPort1: "22"
        blockedPort2: "3389"
      MaximumExecutionFrequency: !Ref MaximumExecutionFrequency
      Scope:
        ComplianceResourceTypes:
          - "AWS::EC2::SecurityGroup"

  AutoRemediation:
    Type: AWS::Config::RemediationConfiguration
    Properties:
      ConfigRuleName: !Ref RestrictedPortsConfigRule
      TargetType: SSM_DOCUMENT
      TargetId: !Ref RemediationAutomationDocument
      Automatic: true
      MaximumAutomaticAttempts: 3
      RetryAttemptSeconds: 60
      Parameters:
        AutomationAssumeRole:
          StaticValue:
            Values:
              - !GetAtt AutomationAssumeRole.Arn
        SecurityGroupId:
          ResourceValue:
            Value: RESOURCE_ID

Outputs:
  LambdaFunctionArn:
    Description: ARN of the remediation Lambda function
    Value: !GetAtt RemediationFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for remediation notifications
    Value: !Ref RemediationTopic

  ConfigRuleName:
    Description: Name of the AWS Config rule
    Value: !Ref RestrictedPortsConfigRule

  LogEncryptionKeyArn:
    Description: ARN of the KMS key encrypting the Lambda's log group and environment variables
    Value: !GetAtt LogEncryptionKey.Arn
