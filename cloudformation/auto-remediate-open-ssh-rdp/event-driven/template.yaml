AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Auto-revokes security group ingress rules that open SSH (22) or RDP (3389)
  to the internet (0.0.0.0/0 or ::/0), in near real-time. Listens for the
  AuthorizeSecurityGroupIngress management event via EventBridge (no
  dedicated CloudTrail trail required - management events are available on
  the default event bus automatically) and revokes only the offending
  rule(s) the moment they're created. Works in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for remediation
      notifications. Leave blank to skip the subscription (you can add one
      later in the SNS console).

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (remediate_open_ssh_rdp.py zipped as lambda.zip). Must be in the same
      region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "auto-remediate-open-ssh-rdp/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  RemediationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-sg-remediation-notifications"
      KmsMasterKeyId: alias/aws/sns

  RemediationTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref RemediationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  RemediationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-remediation-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600 # 14 days - time to notice and investigate a failed remediation

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} remediation Lambda's log group and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-remediate-open-ssh-rdp"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-remediate-ssh-rdp-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RemediateSSHRDPPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                Resource: "*"
                # Describe is a read-only action and EC2 does not support
                # resource-level permissions for it - "*" is required here.
              - Effect: Allow
                Action:
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RemediationTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RemediationDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn

  RemediationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls AWS control-plane APIs (EC2, SNS,
              SQS) over the public AWS API endpoints - it doesn't touch any
              resource inside a customer VPC. Placing it in a VPC would add
              NAT gateway/VPC endpoint cost and complexity with no security
              benefit for this workload.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-remediate-open-ssh-rdp"
      Description: Revokes SG ingress rules that open 22/3389 to the internet.
      Runtime: python3.12
      Handler: remediate_open_ssh_rdp.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt RemediationDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref RemediationTopic
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  RemediationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RemediationFunction}"
      RetentionInDays: 90
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  OpenIngressEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-authorize-sg-ingress"
      Description: Matches AuthorizeSecurityGroupIngress API calls captured by CloudTrail.
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - AuthorizeSecurityGroupIngress
      State: ENABLED
      Targets:
        - Arn: !GetAtt RemediationFunction.Arn
          Id: RemediationFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemediationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OpenIngressEventRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the remediation Lambda function
    Value: !GetAtt RemediationFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for remediation notifications
    Value: !Ref RemediationTopic

  EventRuleArn:
    Description: ARN of the EventBridge rule watching for AuthorizeSecurityGroupIngress
    Value: !GetAtt OpenIngressEventRule.Arn

  LogEncryptionKeyArn:
    Description: ARN of the KMS key encrypting the Lambda's log group and environment variables
    Value: !GetAtt LogEncryptionKey.Arn
