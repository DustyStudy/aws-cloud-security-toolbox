AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys a library of preventive Service Control Policies for AI/ML
  workloads - Bedrock logging/guardrails protection, a Bedrock foundation
  model allow-list, and SageMaker notebook lockdown/encryption - and
  attaches them to the given AWS Organizations targets. Each policy can be
  toggled independently. Deploy this stack in the Organizations
  **management account** (or a delegated admin account for Organizations,
  if configured).

Parameters:
  TargetIds:
    Type: CommaDelimitedList
    Description: >
      OU IDs, account IDs, and/or the org root ID to attach every enabled
      policy to (e.g. "ou-abcd-11111111,123456789012").

  EnableDenyDisableBedrockLoggingAndGuardrails:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny disabling Bedrock model invocation logging or deleting Bedrock Guardrails.

  EnableRestrictBedrockFoundationModels:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Restrict bedrock:InvokeModel/InvokeModelWithResponseStream to an
      allow-listed set of foundation models. Off by default - review
      AllowedBedrockModelPatterns before enabling, or every model
      invocation in the account will be denied.

  AllowedBedrockModelPatterns:
    Type: CommaDelimitedList
    Default: "anthropic.claude*,amazon.titan*"
    Description: >
      Foundation-model resource ARN patterns permitted when
      EnableRestrictBedrockFoundationModels is true (matched against
      arn:*:bedrock:*::foundation-model/<pattern>). Ignored otherwise.

  EnableLockdownSageMakerNotebooks:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny SageMaker notebook instances with direct internet access, root access, or no VPC.

  EnableRequireSageMakerEncryption:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deny SageMaker notebook instances and training jobs that don't specify a KMS key.

Conditions:
  CreateDenyDisableBedrockLoggingAndGuardrails: !Equals [!Ref EnableDenyDisableBedrockLoggingAndGuardrails, "true"]
  CreateRestrictBedrockFoundationModels: !Equals [!Ref EnableRestrictBedrockFoundationModels, "true"]
  CreateLockdownSageMakerNotebooks: !Equals [!Ref EnableLockdownSageMakerNotebooks, "true"]
  CreateRequireSageMakerEncryption: !Equals [!Ref EnableRequireSageMakerEncryption, "true"]

Resources:
  DenyDisableBedrockLoggingAndGuardrailsPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateDenyDisableBedrockLoggingAndGuardrails
    Properties:
      Name: !Sub "${AWS::StackName}-deny-disable-bedrock-logging"
      Description: Denies disabling Bedrock model invocation logging or deleting Bedrock Guardrails.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyDisableBedrockInvocationLogging",
              "Effect": "Deny",
              "Action": "bedrock:DeleteModelInvocationLoggingConfiguration",
              "Resource": "*"
            },
            {
              "Sid": "DenyDeleteBedrockGuardrails",
              "Effect": "Deny",
              "Action": "bedrock:DeleteGuardrail",
              "Resource": "*"
            }
          ]
        }

  RestrictBedrockFoundationModelsPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateRestrictBedrockFoundationModels
    Properties:
      Name: !Sub "${AWS::StackName}-restrict-bedrock-models"
      Description: Restricts Bedrock model invocation to an allow-listed set of foundation models.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content:
        !Sub
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DenyDisallowedFoundationModels",
                  "Effect": "Deny",
                  "Action": ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"],
                  "NotResource": ["arn:*:bedrock:*::foundation-model/${ModelArnPatterns}"]
                }
              ]
            }
          - ModelArnPatterns: !Join
              - '", "arn:*:bedrock:*::foundation-model/'
              - !Ref AllowedBedrockModelPatterns

  LockdownSageMakerNotebooksPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateLockdownSageMakerNotebooks
    Properties:
      Name: !Sub "${AWS::StackName}-lockdown-sagemaker-notebooks"
      Description: Denies SageMaker notebook instances with direct internet access, root access, or no VPC.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenySageMakerDirectInternetAccess",
              "Effect": "Deny",
              "Action": ["sagemaker:CreateNotebookInstance", "sagemaker:UpdateNotebookInstance"],
              "Resource": "*",
              "Condition": { "StringEquals": { "sagemaker:DirectInternetAccess": "Enabled" } }
            },
            {
              "Sid": "DenySageMakerRootAccess",
              "Effect": "Deny",
              "Action": ["sagemaker:CreateNotebookInstance", "sagemaker:UpdateNotebookInstance"],
              "Resource": "*",
              "Condition": { "StringEquals": { "sagemaker:RootAccess": "Enabled" } }
            },
            {
              "Sid": "DenySageMakerNotebookWithoutVPC",
              "Effect": "Deny",
              "Action": "sagemaker:CreateNotebookInstance",
              "Resource": "*",
              "Condition": { "Null": { "sagemaker:VpcSubnets": "true" } }
            }
          ]
        }

  RequireSageMakerEncryptionPolicy:
    Type: AWS::Organizations::Policy
    Condition: CreateRequireSageMakerEncryption
    Properties:
      Name: !Sub "${AWS::StackName}-require-sagemaker-encryption"
      Description: Denies SageMaker notebook instances and training jobs that don't specify a KMS key.
      Type: SERVICE_CONTROL_POLICY
      TargetIds: !Ref TargetIds
      Content: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenySageMakerNotebookWithoutKMS",
              "Effect": "Deny",
              "Action": "sagemaker:CreateNotebookInstance",
              "Resource": "*",
              "Condition": { "Null": { "sagemaker:VolumeKmsKey": "true" } }
            },
            {
              "Sid": "DenySageMakerTrainingJobWithoutVolumeKMS",
              "Effect": "Deny",
              "Action": "sagemaker:CreateTrainingJob",
              "Resource": "*",
              "Condition": { "Null": { "sagemaker:VolumeKmsKey": "true" } }
            },
            {
              "Sid": "DenySageMakerTrainingJobWithoutOutputKMS",
              "Effect": "Deny",
              "Action": "sagemaker:CreateTrainingJob",
              "Resource": "*",
              "Condition": { "Null": { "sagemaker:OutputKmsKey": "true" } }
            }
          ]
        }

Outputs:
  AttachedTargets:
    Description: Targets these guardrail policies were attached to
    Value: !Join [",", !Ref TargetIds]
