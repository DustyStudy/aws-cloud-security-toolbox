AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Guards against the most common real-world agentic AI incident: not a
  breach, but an agent stuck in a loop calling itself or a tool
  repeatedly, running up a large bill overnight before anyone notices.
  Combines two complementary AWS-native cost controls, both scoped to
  Amazon Bedrock: a monthly budget with a hard ceiling (predictable,
  threshold-based) and Cost Anomaly Detection (ML-based, catches unusual
  spend spikes even before they reach the budget ceiling). No Lambda -
  purely native AWS Budgets and Cost Explorer resources. Works in AWS
  commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for cost
      alerts. Leave blank to skip the subscription.

  MonthlyBudgetLimitUSD:
    Type: Number
    Default: 500
    Description: >
      Monthly USD ceiling for Amazon Bedrock spend. Notifications fire at
      80% of actual spend and 100% of forecasted spend.

  AnomalyThresholdUSD:
    Type: Number
    Default: 50
    Description: >
      Dollar impact threshold above which a detected cost anomaly in
      Amazon Bedrock spend triggers an immediate notification. Cost
      Anomaly Detection uses machine learning against your account's own
      historical spend pattern, so it can catch a spike well before it
      reaches the monthly budget ceiling above.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  CostAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-bedrock-cost-alerts"
      KmsMasterKeyId: alias/aws/sns

  CostAlertsTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref CostAlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CostAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CostAlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCostAnomalyDetectionPublish
            Effect: Allow
            Principal:
              Service: costalerts.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref CostAlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref CostAlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:*"

  BedrockAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: !Sub "${AWS::StackName}-bedrock-spend"
      MonitorType: CUSTOM
      MonitorSpecification: '{"Dimensions":{"Key":"SERVICE","Values":["Amazon Bedrock"],"MatchOptions":["EQUALS"]}}'

  BedrockAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: !Sub "${AWS::StackName}-bedrock-spend-alerts"
      # SNS delivery requires IMMEDIATE frequency - DAILY/WEEKLY only
      # support email subscribers.
      Frequency: IMMEDIATE
      MonitorArnList:
        - !Ref BedrockAnomalyMonitor
      Subscribers:
        - Type: SNS
          Address: !Ref CostAlertsTopic
      Threshold: !Ref AnomalyThresholdUSD

  BedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-bedrock-monthly-budget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUSD
          Unit: USD
        CostFilters:
          Service:
            - "Amazon Bedrock"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref CostAlertsTopic

Outputs:
  SNSTopicArn:
    Description: ARN of the SNS topic used for Bedrock cost alerts
    Value: !Ref CostAlertsTopic

  AnomalyMonitorArn:
    Description: ARN of the Bedrock cost anomaly monitor
    Value: !Ref BedrockAnomalyMonitor

  BudgetName:
    Description: Name of the Bedrock monthly budget
    Value: !Ref BedrockBudget
