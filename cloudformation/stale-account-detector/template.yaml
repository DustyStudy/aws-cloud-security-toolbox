AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Scans every ACTIVE account in the AWS Organization for CloudTrail
  activity in the last N days, using an organization-wide CloudTrail
  Lake event data store queried with SQL - no Athena/Glue setup
  required. Emails a report via SNS only when it actually finds stale
  accounts (never a routine "all clear" notification). Deploy in the
  Organizations management account (or a registered delegated
  administrator for CloudTrail) - only there can you list every account
  in the org and query an organization-scoped event data store. Works in
  AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for the
      stale-account report. Leave blank to skip the subscription.

  ScheduleExpression:
    Type: String
    Default: "rate(7 days)"
    Description: EventBridge schedule expression controlling how often the scan runs.

  ActivityLookbackDays:
    Type: Number
    Default: 90
    Description: >
      Accounts with no CloudTrail activity in this many days are
      reported as stale. Also bounds the CloudTrail Lake query window -
      keep this at or below the event data store's actual retention
      period.

  ExcludedAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Account IDs to always skip (break-glass accounts, intentionally
      idle sandboxes, log-archive accounts, etc.).

  ExemptTagKey:
    Type: String
    Default: ""
    Description: >
      Optional AWS Organizations account tag key. Accounts carrying this
      tag are skipped entirely. Leave blank to check every account.

  ExemptTagValue:
    Type: String
    Default: ""
    Description: >
      Optional value ExemptTagKey must match. Leave blank to exempt on
      the tag key's presence alone (any value).

  CreateEventDataStore:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Create a new organization-wide CloudTrail Lake event data store
      (management events only, scoped to keep ingestion cost down). Set
      to false if you already have a suitable one and supply its ID via
      ExistingEventDataStoreId instead - CloudTrail Lake bills by
      ingestion volume, so avoid standing up a duplicate store just for
      this tool if one already exists.

  ExistingEventDataStoreArn:
    Type: String
    Default: "arn:aws:cloudtrail:us-east-1:000000000000:eventdatastore/00000000-0000-0000-0000-000000000000"
    Description: >
      Full ARN of an existing organization-wide CloudTrail Lake event
      data store to query instead of creating a new one. Required if
      CreateEventDataStore is false (the default value here is just a
      syntactically-valid placeholder that's never actually used when
      CreateEventDataStore is true - cfn-lint validates parameter
      defaults against the ARN pattern regardless of which Fn::If branch
      is actually selected). It must be organization-enabled and include
      management events, or this tool won't see activity from member
      accounts.

  EventDataStoreRetentionDays:
    Type: Number
    Default: 92
    Description: >
      Retention period (days) for the event data store this template
      creates. Ignored if CreateEventDataStore is false. Minimum
      supported by CloudTrail Lake is 7 days; keep this comfortably
      above ActivityLookbackDays.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (detect_stale_accounts.py zipped as lambda.zip). Must be in the
      same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "stale-account-detector/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]
  ShouldCreateEventDataStore: !Equals [!Ref CreateEventDataStore, "true"]

Resources:
  # ---------------------------------------------------------------------
  # CloudTrail Lake - organization-wide, management events only. Data
  # events (S3 object reads, Lambda invocations, etc.) are deliberately
  # excluded: they're high-volume, they cost more to ingest, and account
  # staleness only needs to know whether *anyone did anything* in an
  # account, which management events already capture (including
  # ConsoleLogin).
  # ---------------------------------------------------------------------
  OrganizationActivityEventDataStore:
    Type: AWS::CloudTrail::EventDataStore
    Condition: ShouldCreateEventDataStore
    Properties:
      Name: !Sub "${AWS::StackName}-org-activity"
      OrganizationEnabled: true
      MultiRegionEnabled: true
      RetentionPeriod: !Ref EventDataStoreRetentionDays
      TerminationProtectionEnabled: true
      KmsKeyId: !GetAtt LogEncryptionKey.Arn
      AdvancedEventSelectors:
        - Name: "Management events only"
          FieldSelectors:
            - Field: eventCategory
              Equals: ["Management"]

  # ---------------------------------------------------------------------
  # SNS + KMS
  # ---------------------------------------------------------------------
  ReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-stale-account-report"
      KmsMasterKeyId: alias/aws/sns

  ReportTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref ReportTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  DetectorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-detector-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} stale-account detector Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-detect-stale-accounts"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"
          - Sid: AllowCloudTrailToEncryptEventDataStore
            # CloudTrail Lake needs this to encrypt the event data
            # store. aws:SourceAccount (not aws:SourceArn) is used
            # deliberately - the key must exist before the event data
            # store does (the store references the key's ARN), so the
            # store's own ARN isn't available yet to scope a SourceArn
            # condition against without a circular dependency. AWS's own
            # docs call this out as a supported, if less strict,
            # alternative for exactly this case.
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:eventdatastore/*"

  # ---------------------------------------------------------------------
  # IAM
  # ---------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_355
            comment: >-
              organizations:ListAccounts and organizations:ListTagsForResource
              don't support resource-level scoping - "*" is required for
              that statement specifically; every other statement in this
              role's policy is scoped to a specific resource ARN.
    Properties:
      RoleName: !Sub "${AWS::StackName}-detector-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StaleAccountDetectorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:ListTagsForResource
                Resource: "*"
                # Organizations' list/read APIs for the whole org don't
                # support resource-level scoping.
              - Effect: Allow
                Action:
                  - cloudtrail:StartQuery
                  - cloudtrail:GetQueryResults
                  - cloudtrail:DescribeQuery
                Resource: !If
                  - ShouldCreateEventDataStore
                  - !GetAtt OrganizationActivityEventDataStore.EventDataStoreArn
                  - !Ref ExistingEventDataStoreArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ReportTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt DetectorDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  # ---------------------------------------------------------------------
  # Lambda
  # ---------------------------------------------------------------------
  DetectorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls Organizations/CloudTrail Lake/SNS
              control-plane APIs over public AWS endpoints - it doesn't
              touch any resource inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-detect-stale-accounts"
      Description: Scans the org for accounts with no CloudTrail activity in N days.
      Runtime: python3.12
      Handler: detect_stale_accounts.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      DeadLetterConfig:
        TargetArn: !GetAtt DetectorDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ReportTopic
          EVENT_DATA_STORE_ARN: !If [ShouldCreateEventDataStore, !GetAtt OrganizationActivityEventDataStore.EventDataStoreArn, !Ref ExistingEventDataStoreArn]
          ACTIVITY_LOOKBACK_DAYS: !Ref ActivityLookbackDays
          EXCLUDED_ACCOUNT_IDS: !Join [",", !Ref ExcludedAccountIds]
          EXEMPT_TAG_KEY: !Ref ExemptTagKey
          EXEMPT_TAG_VALUE: !Ref ExemptTagValue
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  DetectorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DetectorFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  DetectorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Triggers the stale-account scan on a schedule.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt DetectorFunction.Arn
          Id: DetectorFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DetectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DetectorScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the stale-account detector Lambda function
    Value: !GetAtt DetectorFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for the stale-account report
    Value: !Ref ReportTopic

  EventDataStoreArn:
    Condition: ShouldCreateEventDataStore
    Description: ARN of the created CloudTrail Lake event data store
    Value: !GetAtt OrganizationActivityEventDataStore.EventDataStoreArn
