AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a single AWS Organization CloudTrail trail that automatically
  covers every account in the Organization, including ones created later
  - no per-account deployment needed. Deploy this stack ONCE, in the
  Organizations management account (or a registered delegated
  administrator account for CloudTrail). Works in AWS commercial and
  GovCloud.

Parameters:
  TrailName:
    Type: String
    Default: organization-trail
    Description: Name for the organization trail.

  OrganizationId:
    Type: String
    Default: ""
    Description: >
      Optional AWS Organization ID (e.g. o-abc123xyz0). If set, member
      accounts across the org are granted kms:Decrypt on the trail's KMS
      key (needed if they'll query their own logs directly, e.g. via
      Athena). Leave blank to restrict decryption to this account only.

Conditions:
  HasOrganizationId: !Not [!Equals [!Ref OrganizationId, ""]]

Resources:
  TrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${TrailName}-logs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref TrailEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionAndExpire
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
              - TransitionInDays: 365
                StorageClass: GLACIER
            ExpirationInDays: 2555 # ~7 years - adjust to your retention requirement

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWriteOrgTrail
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AWSCloudTrailWriteMemberAccountLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  TrailEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the Organization CloudTrail trail's log files.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
          - Sid: AllowCloudTrailToDescribeKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: "*"
          - !If
            - HasOrganizationId
            - Sid: AllowOrgAccountsToDecrypt
              Effect: Allow
              Principal:
                AWS: "*"
              Action:
                - kms:Decrypt
                - kms:ReEncryptFrom
              Resource: "*"
              Condition:
                StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
            - !Ref "AWS::NoValue"

  OrganizationTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      IsOrganizationTrail: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !Ref TrailEncryptionKey
      IsLogging: true

Outputs:
  TrailArn:
    Description: ARN of the Organization trail
    Value: !GetAtt OrganizationTrail.Arn

  TrailBucketName:
    Description: Name of the S3 bucket holding trail logs for every account in the Organization
    Value: !Ref TrailBucket
