AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a CloudFormation StackSet (service-managed, auto-deployment
  enabled) that enables GuardDuty, Security Hub, and AWS Config in every
  account within the target Organizational Unit(s) - including accounts
  created *after* this stack is deployed. Deploy this stack once, in the
  Organizations management account or a registered delegated administrator
  account for CloudFormation StackSets. Requires "trusted access" for
  CloudFormation StackSets to be enabled for your Organization (Organizations
  console > Services > CloudFormation StackSets > Enable trusted access, or
  `aws organizations enable-aws-service-access
  --service-principal member.org.stacksets.cloudformation.amazonaws.com`).
  Works in AWS commercial and GovCloud.

Parameters:
  TargetOrganizationalUnitIds:
    Type: CommaDelimitedList
    Description: >
      OU ID(s) to deploy the baseline to (e.g. "ou-abcd-11111111"). Every
      account in these OUs - present and future - gets the baseline.

  Regions:
    Type: CommaDelimitedList
    Default: "us-east-1"
    Description: >
      Region(s) to enable the baseline in within each account (e.g.
      "us-gov-west-1,us-gov-east-1" for GovCloud). AWS Config and GuardDuty
      are regional services - list every region you operate in.

  CallAs:
    Type: String
    Default: SELF
    AllowedValues: ["SELF", "DELEGATED_ADMIN"]
    Description: >
      SELF if deploying from the Organizations management account,
      DELEGATED_ADMIN if deploying from a registered delegated administrator
      account instead.

Resources:
  MemberAccountBaselineStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: !Sub "${AWS::StackName}-member-baseline"
      Description: Enables GuardDuty, Security Hub, and AWS Config in every targeted account.
      PermissionModel: SERVICE_MANAGED
      CallAs: !Ref CallAs
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 20
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds: !Ref TargetOrganizationalUnitIds
          Regions: !Ref Regions
      # The per-account baseline. Runs once per targeted account, in every
      # listed region. Ordinary CFN intrinsic functions here (!Sub, !Ref,
      # !GetAtt) are evaluated per-account by CloudFormation when it
      # provisions each stack instance - this is a normal nested template,
      # just embedded inline instead of referenced by S3 URL.
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: Per-account security baseline - GuardDuty, Security Hub, AWS Config.

        Resources:
          GuardDutyDetector:
            Type: AWS::GuardDuty::Detector
            Properties:
              Enable: true
              FindingPublishingFrequency: FIFTEEN_MINUTES

          SecurityHub:
            Type: AWS::SecurityHub::Hub
            Properties:
              EnableDefaultStandards: true

          ConfigBucket:
            Type: AWS::S3::Bucket
            Properties:
              BucketName: !Sub "aws-config-${AWS::AccountId}-${AWS::Region}"
              BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                      SSEAlgorithm: AES256
              PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

          ConfigBucketPolicy:
            Type: AWS::S3::BucketPolicy
            Properties:
              Bucket: !Ref ConfigBucket
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Sid: AWSConfigBucketPermissionsCheck
                    Effect: Allow
                    Principal:
                      Service: config.amazonaws.com
                    Action: s3:GetBucketAcl
                    Resource: !GetAtt ConfigBucket.Arn
                    Condition:
                      StringEquals:
                        aws:SourceAccount: !Ref "AWS::AccountId"
                  - Sid: AWSConfigBucketDelivery
                    Effect: Allow
                    Principal:
                      Service: config.amazonaws.com
                    Action: s3:PutObject
                    Resource: !Sub "${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*"
                    Condition:
                      StringEquals:
                        s3:x-amz-acl: bucket-owner-full-control
                        aws:SourceAccount: !Ref "AWS::AccountId"

          ConfigRole:
            Type: AWS::IAM::Role
            Properties:
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: config.amazonaws.com
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWS_ConfigRole"

          ConfigRecorder:
            Type: AWS::Config::ConfigurationRecorder
            DependsOn: ConfigBucketPolicy
            Properties:
              RoleARN: !GetAtt ConfigRole.Arn
              RecordingGroup:
                AllSupported: true
                IncludeGlobalResourceTypes: false
                # Left false because this same template is applied in every
                # region listed in the outer stack's Regions parameter - if
                # multiple regions are targeted, setting this true in all of
                # them double/triple-records global resources (IAM, etc.) in
                # each account. See the README for how to enable it in a
                # single designated region if you want global resource
                # tracking.

          ConfigDeliveryChannel:
            Type: AWS::Config::DeliveryChannel
            DependsOn: ConfigBucketPolicy
            Properties:
              S3BucketName: !Ref ConfigBucket
              ConfigSnapshotDeliveryProperties:
                DeliveryFrequency: TwentyFour_Hours

        Outputs:
          GuardDutyDetectorId:
            Value: !Ref GuardDutyDetector
          ConfigBucketName:
            Value: !Ref ConfigBucket

Outputs:
  StackSetName:
    Description: Name of the member-account-baseline StackSet
    Value: !Ref MemberAccountBaselineStackSet
