AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Detects SageMaker notebook instances created or updated with
  DirectInternetAccess or RootAccess enabled, and remediates them.
  Because SageMaker only allows changing those settings while a notebook
  is stopped, this is a two-phase EventBridge-driven flow: a
  CreateNotebookInstance/UpdateNotebookInstance event triggers stopping
  the notebook, and SageMaker's own "Notebook Instance State Change"
  event (status=Stopped) triggers the actual reconfiguration. Works in
  AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for
      remediation notifications. Leave blank to skip the subscription.

  AutoRestart:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Restart the notebook automatically after remediation completes.
      Default false - leaves it stopped so an admin can review before
      bringing it back online.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (remediate_sagemaker_notebook_exposure.py zipped as lambda.zip).
      Must be in the same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "sagemaker-notebook-exposure/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  RemediationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-notebook-remediation-notifications"
      KmsMasterKeyId: alias/aws/sns

  RemediationTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref RemediationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  RemediationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-remediation-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} SageMaker remediation Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-remediate-sagemaker-exposure"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-sagemaker-remediation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SageMakerRemediationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - sagemaker:DescribeNotebookInstance
                  - sagemaker:StopNotebookInstance
                  - sagemaker:StartNotebookInstance
                  - sagemaker:UpdateNotebookInstance
                  - sagemaker:AddTags
                  - sagemaker:ListTags
                  - sagemaker:DeleteTags
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RemediationTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RemediationDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  RemediationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls the SageMaker/SNS/SQS control-plane
              APIs over public AWS endpoints - it doesn't touch any
              resource inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-remediate-sagemaker-exposure"
      Description: Detects and remediates SageMaker notebooks with direct internet or root access enabled.
      Runtime: python3.12
      Handler: remediate_sagemaker_notebook_exposure.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt RemediationDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref RemediationTopic
          AUTO_RESTART: !Ref AutoRestart
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  RemediationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RemediationFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  NotebookCreateOrUpdateRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-notebook-create-or-update"
      Description: Matches CreateNotebookInstance/UpdateNotebookInstance API calls captured by CloudTrail.
      EventPattern:
        source:
          - aws.sagemaker
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventName:
            - CreateNotebookInstance
            - UpdateNotebookInstance
      State: ENABLED
      Targets:
        - Arn: !GetAtt RemediationFunction.Arn
          Id: RemediationFunctionCreateUpdateTarget

  NotebookCreateOrUpdatePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemediationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotebookCreateOrUpdateRule.Arn

  NotebookStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-notebook-state-change"
      Description: >-
        Matches SageMaker's native notebook instance state-change events -
        used to finish remediation once a flagged notebook has stopped.
      EventPattern:
        source:
          - aws.sagemaker
        detail-type:
          - "SageMaker Notebook Instance State Change"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RemediationFunction.Arn
          Id: RemediationFunctionStateChangeTarget

  NotebookStateChangePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemediationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotebookStateChangeRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the remediation Lambda function
    Value: !GetAtt RemediationFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for remediation notifications
    Value: !Ref RemediationTopic
