AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Continuous-compliance path: an AWS Config managed rule
  (SAGEMAKER_NOTEBOOK_NO_DIRECT_INTERNET_ACCESS) evaluates every
  SageMaker notebook instance, flagging any with direct internet access
  enabled. A built-in SSM Automation document then invokes the same
  remediation Lambda used by the sibling event-driven/ template to stop
  and reconfigure it. Note: there is no equivalent AWS Config managed
  rule for notebook root access as of this writing - that risk is only
  covered by ../event-driven/, not this path. Requires AWS Config already
  enabled in the account/region. Works in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for
      remediation notifications. Leave blank to skip the subscription.

  AutoRestart:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Restart the notebook automatically after remediation completes.
      Default false - leaves it stopped for review.

  MaximumExecutionFrequency:
    Type: String
    Default: TwentyFour_Hours
    AllowedValues:
      - One_Hour
      - Three_Hours
      - Six_Hours
      - Twelve_Hours
      - TwentyFour_Hours
    Description: How often AWS Config re-evaluates all notebook instances against this rule.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (remediate_sagemaker_notebook_exposure.py zipped as lambda.zip).
      Must be in the same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "sagemaker-notebook-exposure/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  RemediationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-notebook-remediation-notifications"
      KmsMasterKeyId: alias/aws/sns

  RemediationTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref RemediationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  RemediationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-remediation-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} SageMaker remediation Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-remediate-sagemaker-exposure"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-sagemaker-remediation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SageMakerRemediationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - sagemaker:DescribeNotebookInstance
                  - sagemaker:StopNotebookInstance
                  - sagemaker:StartNotebookInstance
                  - sagemaker:UpdateNotebookInstance
                  - sagemaker:AddTags
                  - sagemaker:ListTags
                  - sagemaker:DeleteTags
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:notebook-instance/*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref RemediationTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt RemediationDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  RemediationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls the SageMaker/SNS/SQS control-plane
              APIs over public AWS endpoints - it doesn't touch any
              resource inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-remediate-sagemaker-exposure"
      Description: Detects and remediates SageMaker notebooks with direct internet or root access enabled.
      Runtime: python3.12
      Handler: remediate_sagemaker_notebook_exposure.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt RemediationDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref RemediationTopic
          AUTO_RESTART: !Ref AutoRestart
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  RemediationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RemediationFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  # Also listen for the notebook state-change event so a notebook this
  # path stops (because it was found non-compliant by Config) still gets
  # its settings fixed once it actually reaches Stopped - the SSM
  # Automation invocation below only performs the "flag and stop" half.
  NotebookStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-notebook-state-change"
      Description: Matches SageMaker's native notebook instance state-change events.
      EventPattern:
        source:
          - aws.sagemaker
        detail-type:
          - "SageMaker Notebook Instance State Change"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RemediationFunction.Arn
          Id: RemediationFunctionStateChangeTarget

  NotebookStateChangePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RemediationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotebookStateChangeRule.Arn

  AutomationAssumeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ssm-automation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeRemediationLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RemediationFunction.Arn

  RemediationAutomationDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${AWS::StackName}-RemediateSageMakerNotebookExposure"
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: Invokes the remediation Lambda for a non-compliant SageMaker notebook instance.
        assumeRole: "{{ AutomationAssumeRole }}"
        parameters:
          NotebookInstanceId:
            type: String
            description: The non-compliant notebook instance identifier (Config passes this as RESOURCE_ID).
          AutomationAssumeRole:
            type: String
            description: IAM role ARN used by SSM Automation to execute this document.
        mainSteps:
          - name: InvokeRemediationLambda
            action: aws:invokeLambdaFunction
            inputs:
              FunctionName: !Ref RemediationFunction
              InputPayload:
                notebook_instance_name: "{{ NotebookInstanceId }}"

  NotebookNoDirectInternetAccessConfigRule:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: !Sub "${AWS::StackName}-sagemaker-no-direct-internet"
      Description: Flags SageMaker notebook instances with direct internet access enabled.
      Source:
        Owner: AWS
        SourceIdentifier: SAGEMAKER_NOTEBOOK_NO_DIRECT_INTERNET_ACCESS
      MaximumExecutionFrequency: !Ref MaximumExecutionFrequency
      Scope:
        ComplianceResourceTypes:
          - "AWS::SageMaker::NotebookInstance"

  AutoRemediation:
    Type: AWS::Config::RemediationConfiguration
    Properties:
      ConfigRuleName: !Ref NotebookNoDirectInternetAccessConfigRule
      TargetType: SSM_DOCUMENT
      TargetId: !Ref RemediationAutomationDocument
      Automatic: true
      MaximumAutomaticAttempts: 3
      RetryAttemptSeconds: 60
      Parameters:
        AutomationAssumeRole:
          StaticValue:
            Values:
              - !GetAtt AutomationAssumeRole.Arn
        NotebookInstanceId:
          ResourceValue:
            Value: RESOURCE_ID

Outputs:
  LambdaFunctionArn:
    Description: ARN of the remediation Lambda function
    Value: !GetAtt RemediationFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for remediation notifications
    Value: !Ref RemediationTopic

  ConfigRuleName:
    Description: Name of the AWS Config rule
    Value: !Ref NotebookNoDirectInternetAccessConfigRule
