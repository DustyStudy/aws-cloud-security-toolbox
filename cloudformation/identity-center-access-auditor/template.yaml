AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Audits AWS IAM Identity Center on a schedule: flags permission sets
  carrying AdministratorAccess or risky wildcard inline-policy
  statements, flags account assignments made directly to a user instead
  of a group, and reports unused permission sets as an informational
  addendum. Detective only - never modifies a permission set or
  assignment. Works in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for audit
      notifications. Leave blank to skip the subscription.

  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"
    Description: EventBridge schedule expression controlling how often the audit runs.

  SensitiveWildcardServices:
    Type: CommaDelimitedList
    Default: "iam,ec2,s3,kms,organizations,sts"
    Description: >
      IAM service prefixes where "<service>:*" combined with Resource
      "*" in a permission set's inline policy is flagged as over-broad.

  FlagDirectUserAssignments:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Flag account assignments made directly to a user rather than a
      group. Assignments should generally flow through groups so access
      can be reasoned about and rotated as people change teams.

  ReportUnusedPermissionSets:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Include permission sets provisioned to zero accounts as an
      informational addendum whenever the audit already has other
      findings to report. This never triggers a notification by itself.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (audit_identity_center_access.py zipped as lambda.zip). Must be in
      the same region/partition as this stack, and in the same Region
      as your Identity Center instance (check Identity Center ->
      Settings -> Details in the console).

  LambdaCodeS3Key:
    Type: String
    Default: "identity-center-access-auditor/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  AuditTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-identity-center-audit"
      KmsMasterKeyId: alias/aws/sns

  AuditTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AuditTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  AuditDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-audit-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} Identity Center auditor Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-audit-identity-center"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-identity-center-auditor-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IdentityCenterAuditorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - sso:ListInstances
                  - sso:ListPermissionSets
                  - sso:DescribePermissionSet
                  - sso:ListManagedPoliciesInPermissionSet
                  - sso:GetInlinePolicyForPermissionSet
                  - sso:ListCustomerManagedPolicyReferencesInPermissionSet
                  - sso:ListAccountsForProvisionedPermissionSet
                  - sso:ListAccountAssignments
                Resource: "*"
                # The IAM Identity Center admin API's IAM Action prefix is
                # "sso:", not "sso-admin:" - "sso-admin" is only the
                # boto3/SDK client name (see the Lambda's service
                # namespace). None of these read/list actions support
                # resource-level scoping to a specific instance or
                # permission set ARN - AWS's own example policies use "*".
              - Effect: Allow
                Action:
                  - identitystore:DescribeUser
                  - identitystore:DescribeGroup
                Resource: "*"
                # Same limitation - these take an IdentityStoreId in the
                # request, not the resource, so IAM can't scope by it.
              - Effect: Allow
                Action:
                  - organizations:ListAccounts
                Resource: "*"
                # Best-effort: resolves account IDs to friendly names in
                # the report. The Lambda degrades gracefully (falls back
                # to raw account IDs) if this is denied.
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AuditTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt AuditDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  AuditFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls sso-admin/identitystore/
              organizations/SNS/SQS control-plane APIs over public AWS
              endpoints - it doesn't touch any resource inside a
              customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-audit-identity-center"
      Description: Audits IAM Identity Center permission sets and account assignments for access-governance risks.
      Runtime: python3.12
      Handler: audit_identity_center_access.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 180
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt AuditDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AuditTopic
          SENSITIVE_WILDCARD_SERVICES: !Join [",", !Ref SensitiveWildcardServices]
          FLAG_DIRECT_USER_ASSIGNMENTS: !Ref FlagDirectUserAssignments
          REPORT_UNUSED_PERMISSION_SETS: !Ref ReportUnusedPermissionSets
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  AuditFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AuditFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  AuditScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Triggers the Identity Center access audit on a schedule.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt AuditFunction.Arn
          Id: AuditFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuditFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AuditScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the auditor Lambda function
    Value: !GetAtt AuditFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for audit notifications
    Value: !Ref AuditTopic
