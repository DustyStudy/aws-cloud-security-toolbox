AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fires an SNS notification within seconds of any root user activity -
  console sign-in, API call, or AWS service event performed as root.
  A detective backstop for accounts where the deny-root-user SCP (see
  ../../scp-guardrails/) isn't in place yet, or to catch attempts to use
  root even where it is. No Lambda involved - EventBridge invokes SNS
  directly via an input transformer. Works in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic. Leave blank to
      skip the subscription (you can add one later, or point the topic at
      a chat webhook via a subscribed Lambda).

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  RootActivityTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-root-activity-alerts"
      KmsMasterKeyId: alias/aws/sns

  RootActivityTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref RootActivityTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  RootActivityTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RootActivityTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref RootActivityTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt RootActivityEventRule.Arn

  RootActivityEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-root-activity"
      Description: Matches any CloudTrail event performed as the root user.
      EventPattern:
        detail-type:
          - "AWS Console Sign In via CloudTrail"
          - "AWS API Call via CloudTrail"
          - "AWS Service Event via CloudTrail"
        detail:
          userIdentity:
            type:
              - "Root"
      State: ENABLED
      Targets:
        - Arn: !Ref RootActivityTopic
          Id: RootActivityTopicTarget
          InputTransformer:
            InputPathsMap:
              account: "$.account"
              region: "$.region"
              time: "$.time"
              eventName: "$.detail.eventName"
              eventSource: "$.detail.eventSource"
              sourceIP: "$.detail.sourceIPAddress"
            InputTemplate: >-
              "Root user activity detected in account <account> (<region>) at <time>: <eventSource> <eventName> from <sourceIP>. Investigate immediately if this wasn't expected."

Outputs:
  SNSTopicArn:
    Description: ARN of the SNS topic receiving root activity alerts
    Value: !Ref RootActivityTopic

  EventRuleArn:
    Description: ARN of the EventBridge rule watching for root activity
    Value: !GetAtt RootActivityEventRule.Arn
