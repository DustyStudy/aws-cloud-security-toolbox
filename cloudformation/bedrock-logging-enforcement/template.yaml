AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Checks the account's Bedrock model invocation logging configuration on
  a schedule and re-enables it (to a designated S3 bucket and CloudWatch
  Logs group) if it's missing or was disabled, notifying via SNS. This is
  the only audit trail of what prompts/completions passed through your
  models - one API call turns it off, and it's easy to not notice. Works
  in AWS commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for drift
      notifications. Leave blank to skip the subscription.

  ScheduleExpression:
    Type: String
    Default: "rate(1 day)"
    Description: EventBridge schedule expression controlling how often the check runs.

  LogTextData:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Log text prompts/completions.

  LogImageData:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Log image inputs/outputs (can be large - consider cost/storage before enabling).

  LogEmbeddingData:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Log embedding inputs.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (enforce_bedrock_logging.py zipped as lambda.zip). Must be in the
      same region/partition as this stack.

  LambdaCodeS3Key:
    Type: String
    Default: "bedrock-logging-enforcement/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]

Resources:
  EnforcementTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-bedrock-logging-drift"
      KmsMasterKeyId: alias/aws/sns

  EnforcementTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref EnforcementTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  EnforcementDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-enforcement-dlq"
      KmsMasterKeyId: !Ref LogEncryptionKey
      MessageRetentionPeriod: 1209600

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} Bedrock logging enforcement Lambda's log group, DLQ, and environment variables."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-enforce-bedrock-logging"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AWS::StackName}-bedrock-invocation-logs"
          - Sid: AllowSQSUseOfKey
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref "AWS::AccountId"

  BedrockLogBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Server access logging omitted for this starter template - add an access-log bucket like the one in organization-trail/ if required.
          - id: CKV_AWS_144
            comment: Cross-region replication omitted for this starter template - add if your compliance regime requires geographic redundancy.
          - id: CKV_AWS_145
            comment: >-
              Bedrock's S3 log-delivery mechanism does not support SSE-KMS
              destination buckets - SSE-S3 is required here. This is a
              documented AWS limitation, not an oversight.
    Properties:
      BucketName: !Sub "${AWS::StackName}-bedrock-invocation-logs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
              # Bedrock's log-delivery mechanism for S3 uses its own
              # service-side encryption handling; SSE-KMS destination
              # buckets are not supported for this delivery path.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 365
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BedrockLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BedrockLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBedrockLogDelivery
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${BedrockLogBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:*"

  BedrockLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "${AWS::StackName}-bedrock-invocation-logs"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  BedrockToCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bedrock-cloudwatch-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
      Policies:
        - PolicyName: BedrockToCloudWatchLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${BedrockLogGroup.Arn}:*"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-bedrock-logging-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockLoggingEnforcementPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - bedrock:PutModelInvocationLoggingConfiguration
                Resource: "*"
                # Bedrock's account-level logging configuration APIs are
                # not resource-scopable - "*" is required.
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref EnforcementTopic
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt EnforcementDLQ.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  EnforcementFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls the Bedrock/SNS/SQS control-plane
              APIs over public AWS endpoints - it doesn't touch any
              resource inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-enforce-bedrock-logging"
      Description: Checks and enforces Bedrock model invocation logging configuration.
      Runtime: python3.12
      Handler: enforce_bedrock_logging.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      DeadLetterConfig:
        TargetArn: !GetAtt EnforcementDLQ.Arn
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref EnforcementTopic
          S3_BUCKET_NAME: !Ref BedrockLogBucket
          CLOUDWATCH_LOG_GROUP: !Ref BedrockLogGroup
          CLOUDWATCH_ROLE_ARN: !GetAtt BedrockToCloudWatchRole.Arn
          LOG_TEXT: !Ref LogTextData
          LOG_IMAGE: !Ref LogImageData
          LOG_EMBEDDING: !Ref LogEmbeddingData
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  EnforcementFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EnforcementFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  EnforcementScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-schedule"
      Description: Triggers the Bedrock logging enforcement check on a schedule.
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt EnforcementFunction.Arn
          Id: EnforcementFunctionTarget

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EnforcementFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EnforcementScheduleRule.Arn

Outputs:
  LambdaFunctionArn:
    Description: ARN of the enforcement Lambda function
    Value: !GetAtt EnforcementFunction.Arn

  SNSTopicArn:
    Description: ARN of the SNS topic used for drift notifications
    Value: !Ref EnforcementTopic

  BedrockLogBucketName:
    Description: Name of the S3 bucket Bedrock delivers invocation logs to
    Value: !Ref BedrockLogBucket

  BedrockLogGroupName:
    Description: Name of the CloudWatch Logs group Bedrock delivers invocation logs to
    Value: !Ref BedrockLogGroup
