AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Receives Wiz webhook deliveries via an API Gateway HTTP API and bridges
  them into this repo's patterns: an SNS notification, and optionally an
  invocation of one of this repo's own remediation Lambdas for findings
  that match a configured mapping. Schema-tolerant by design - see the
  module README before relying on this in production. Works in AWS
  commercial and GovCloud.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address to subscribe to the SNS topic for bridged
      notifications. Leave blank to skip the subscription.

  MinimumSeverity:
    Type: String
    Default: "HIGH"
    AllowedValues: ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFORMATIONAL"]
    Description: >
      Lowest severity to notify on. A finding whose severity can't be
      resolved from SeverityFieldPath is always notified regardless of
      this setting (fails open, not silent).

  SeverityFieldPath:
    Type: String
    Default: "severity"
    Description: Dot-notation path to the severity field in the Wiz webhook payload.

  TitleFieldPath:
    Type: String
    Default: "title"
    Description: Dot-notation path to a human-readable title/rule-name field in the payload.

  ResourceFieldPath:
    Type: String
    Default: "primaryResource"
    Description: >-
      Dot-notation path to a resource object/identifier field in the
      payload. Defaults to "primaryResource", an object in Wiz's schema -
      rendered as JSON in the report since its internal shape isn't
      assumed.

  RemediationLambdaMapping:
    Type: String
    Default: "{}"
    Description: >
      JSON object string mapping a title value (as resolved by
      TitleFieldPath) to a Lambda function ARN to invoke with the
      normalized finding. Every ARN referenced here must also be listed
      in RemediationLambdaArns so the execution role is actually granted
      permission to invoke it. Default "{}" (notify only, no forwarding).

  RemediationLambdaArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      ARNs of Lambda functions this bridge is allowed to invoke (must
      match the values used in RemediationLambdaMapping). Leave blank if
      you're only using this module to notify, not to trigger
      remediation.

  LambdaCodeS3Bucket:
    Type: String
    Description: >
      S3 bucket containing the packaged Lambda deployment zip
      (wiz_webhook_bridge.py zipped as lambda.zip).

  LambdaCodeS3Key:
    Type: String
    Default: "wiz-finding-bridge/lambda.zip"
    Description: S3 key for the packaged Lambda deployment zip.

  CodeSigningConfigArn:
    Type: String
    Default: ""
    Description: >
      Optional ARN of an existing AWS Signer AWS::Lambda::CodeSigningConfig
      to enforce code-signature validation on this function. Leave blank
      to skip.

  ThrottleBurstLimit:
    Type: Number
    Default: 10
    Description: API Gateway stage-level burst limit for the webhook route.

  ThrottleRateLimit:
    Type: Number
    Default: 5
    Description: API Gateway stage-level steady-state requests-per-second limit.

Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  HasCodeSigningConfig: !Not [!Equals [!Ref CodeSigningConfigArn, ""]]
  HasRemediationLambdaArns: !Not [!Equals [!Join [",", !Ref RemediationLambdaArns], ""]]

Resources:
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_57
            comment: >-
              This secret is a static token embedded in the webhook URL
              pasted into Wiz's console, not a rotatable service
              credential - automatic rotation would silently break the
              Wiz integration until someone manually re-pastes the new
              URL. Rotate manually (re-run the secret retrieval command
              in the README, update it in Wiz) if you suspect exposure.
    Properties:
      Name: !Sub "${AWS::StackName}-wiz-webhook-secret"
      Description: >-
        Long random token that must appear as the last path segment of
        the webhook URL pasted into Wiz's Webhook integration. Retrieve
        the generated value after deploy - see the module README.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
        ExcludeCharacters: "\"'\\/@ "

  AuditTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-wiz-finding-bridge"
      KmsMasterKeyId: alias/aws/sns

  AuditTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref AuditTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  LogEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Encrypts the ${AWS::StackName} Wiz finding bridge Lambda's log group and API Gateway access log group."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsUseOfKey
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-wiz-finding-bridge-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WizFindingBridgePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WebhookSecret
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AuditTopic
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt LogEncryptionKey.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  RemediationInvokePolicy:
    Type: AWS::IAM::Policy
    Condition: HasRemediationLambdaArns
    Properties:
      PolicyName: !Sub "${AWS::StackName}-remediation-invoke"
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Ref RemediationLambdaArns

  BridgeFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_117
            comment: >-
              This function only calls Secrets Manager/SNS/Lambda control-
              plane APIs over public AWS endpoints - it doesn't touch any
              resource inside a customer VPC.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-wiz-webhook-bridge"
      Description: Bridges Wiz webhook findings into SNS and, optionally, this repo's own remediation Lambdas.
      Runtime: python3.12
      Handler: wiz_webhook_bridge.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 5
      KmsKeyArn: !GetAtt LogEncryptionKey.Arn
      CodeSigningConfigArn: !If [HasCodeSigningConfig, !Ref CodeSigningConfigArn, !Ref "AWS::NoValue"]
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AuditTopic
          WEBHOOK_SECRET_ARN: !Ref WebhookSecret
          MIN_SEVERITY: !Ref MinimumSeverity
          SEVERITY_FIELD_PATH: !Ref SeverityFieldPath
          TITLE_FIELD_PATH: !Ref TitleFieldPath
          RESOURCE_FIELD_PATH: !Ref ResourceFieldPath
          REMEDIATION_LAMBDA_MAP: !Ref RemediationLambdaMapping
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key

  BridgeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${BridgeFunction}"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-wiz-webhook"
      ProtocolType: HTTP
      Description: Receives Wiz webhook deliveries and forwards them to the bridge Lambda.

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BridgeFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      # checkov:skip=CKV_AWS_59: intentionally no IAM/JWT authorizer here -
      # this endpoint authenticates the caller via an unguessable secret
      # path segment instead, matching the only configuration surface
      # Wiz's basic Webhook integration exposes (a destination URL, no
      # custom headers). See the module README.
      RouteKey: "POST /wiz-webhook/{secretToken}"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-wiz-webhook"
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogEncryptionKey.Arn

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        # Deliberately excludes the request body from the access log line
        # (it can contain finding details) - only metadata about the call.
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","routeKey":"$context.routeKey","status":"$context.status","integrationErrorMessage":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit
        ThrottlingRateLimit: !Ref ThrottleRateLimit

  ApiGatewayInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BridgeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/wiz-webhook/*"

Outputs:
  WebhookUrlBase:
    Description: >-
      Base invoke URL for this API. The full webhook URL to paste into Wiz
      is this value + "/wiz-webhook/" + the secret from WebhookSecret (see
      the module README for the retrieval command).
    Value: !GetAtt HttpApi.ApiEndpoint

  WebhookSecretArn:
    Description: ARN of the Secrets Manager secret holding the webhook path token
    Value: !Ref WebhookSecret

  SNSTopicArn:
    Description: ARN of the SNS topic used for bridged notifications
    Value: !Ref AuditTopic
