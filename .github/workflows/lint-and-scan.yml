name: Lint and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cloudformation:
    name: CloudFormation (cfn-lint + Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint 'cloudformation/**/*.yaml'

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: cloudformation
          framework: cloudformation
          quiet: true

  terraform:
    name: Terraform (fmt, validate, tflint, Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform

      - name: Terraform init and validate
        run: |
          find terraform -name '*.tf' -printf '%h\n' | sort -u | while read -r dir; do
            echo "Validating $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Run TFLint
        run: |
          find terraform -name '*.tf' -printf '%h\n' | sort -u | while read -r dir; do
            echo "Linting $dir"
            (cd "$dir" && tflint --init && tflint)
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: true
