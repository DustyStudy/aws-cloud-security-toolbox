name: Lint and Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for the whole workflow: every job below only
# reads repository content (checkout, lint, scan) - none of them push
# commits, open PRs, or write to any other GitHub API surface. Without
# this, GITHUB_TOKEN falls back to whatever the repo/org default is,
# which can be broader than this workflow actually needs.
permissions:
  contents: read

jobs:
  cloudformation:
    name: CloudFormation (cfn-lint + Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # this job never pushes back to the repo

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install "cfn-lint==1.55.1"

      - name: Run cfn-lint
        run: cfn-lint 'cloudformation/**/*.yaml'

      - name: Run Checkov
        # The "set-output is deprecated" warning this step produces comes
        # from checkov-action's own internal Docker-output-relay wrapper,
        # not from anything in this workflow - checkov-action runs as a
        # Docker action (not JavaScript), so it was never subject to the
        # Node.js runtime deprecations either. Dependabot (see
        # .github/dependabot.yml) will surface newer checkov-action
        # releases if/when upstream modernizes that wrapper.
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: cloudformation
          framework: cloudformation
          quiet: true

  terraform:
    name: Terraform (fmt, validate, tflint, Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # this job never pushes back to the repo

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform

      - name: Terraform init and validate
        run: |
          find terraform -name '*.tf' -printf '%h\n' | sort -u | while read -r dir; do
            echo "Validating $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Run TFLint
        run: |
          find terraform -name '*.tf' -printf '%h\n' | sort -u | while read -r dir; do
            echo "Linting $dir"
            (cd "$dir" && tflint --init && tflint)
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
